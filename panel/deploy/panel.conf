# sodama 控制面板配置（key = value，# 注释；命令行参数优先于本文件）

# 监听地址（默认仅本机；需要 LAN 访问时改成 0.0.0.0:8080，并务必设置 token）
# 非回环地址且 token 为空时，面板会拒绝启动（fail-closed）。
bind = 127.0.0.1:8080

# 前端静态资源目录
static_dir = /usr/share/sodama-panel/dist

# 引擎与状态面
sodama = /usr/bin/sodama
socket = /var/run/sodama.sock
log_file = /var/log/sodama.log

# 访问 token：仅回环绑定时可留空；绑定非回环地址必须设置（HttpOnly 会话 Cookie）
token =

# 会话有效期（秒；默认 7 天）
# session_ttl = 604800

# 控制类动作（reload / suspend / resume）默认关闭，按需打开
enable_actions = 0

# 单条命令超时（秒）
timeout = 20

# 曲线/节点历史的采样步长与缓冲点数
# sample_secs = 5
# sample_when_idle = 0   # 默认 0：无人看面板时不采样（好让引擎空闲退避，省 CPU/内存）
# series_points = 1440      # ≈2h
# node_points = 720         # 每节点 ≈1h

# ---- 引擎文件（面板内在线编辑用；缺省如下）----
# engine_config = /etc/sodama/config.dae   # 主配置（须以 .dae 结尾，validate 后落盘）
# rules_dir = /etc/sodama/rules            # 规则集目录（*.txt/*.list/*.md 可编辑）
