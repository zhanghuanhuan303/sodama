[workspace]
resolver = "2"
members = ["shared", "backend", "frontend"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/zhanghuanhuan303/sodama"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "shared" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
