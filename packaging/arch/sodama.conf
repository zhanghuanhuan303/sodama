# sodama 启动环境（systemd EnvironmentFile；`#` 注释，不要写 export）
#
# 数据面对：systemd 单元启动前执行 /usr/lib/sodama/datapath setup，
# 停止后执行 teardown。若你已有自己的拓扑（或只想跑本机代理），设为 0。
SODAMA_DATAPATH=1

# 数据面对命名（需与 sodama 的 --daens/--dae0/--dae0peer 一致；默认即下列值）
#DAE_NS=daens
#DAE0=dae0
#DAE0PEER=dae0peer

# IPv6 数据面（1=启用；地址配置失败仅告警）
#SODAMA_DATAPATH_IPV6=1
