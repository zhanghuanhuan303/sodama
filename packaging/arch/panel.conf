# sodama 控制面板配置（key = value；命令行参数优先于本文件）
# Arch 安装后位于 /etc/sodama-panel/panel.conf

# 监听地址（默认仅本机；需要局域网访问就改成 0.0.0.0:8080，并设 token）
bind = 127.0.0.1:8080

# 前端静态资源目录（AUR 包安装位置）
static_dir = /usr/share/sodama-panel/dist

# 引擎与状态面
sodama = /usr/bin/sodama
socket = /run/sodama/status.sock
log_file = /var/log/sodama.log

# 访问 token：留空 = 免认证（仅建议内网/SSH 隧道）；设置后需登录（HttpOnly 会话 Cookie）
token =

# 会话有效期（秒；默认 7 天）
# session_ttl = 604800

# 控制类动作（reload / suspend / resume）默认开启；默认只监听 127.0.0.1，
# 若要改成 0.0.0.0 对外提供，请务必同时设 token。
# 注意：面板还提供「编辑配置并热重载」，本质上等价于改配置权限。
enable_actions = 1

# 单条命令超时（秒）
timeout = 20

# 曲线/节点历史采样
# sample_secs = 5
# sample_when_idle = 0
# series_points = 1440
# node_points = 720

# ---- 引擎文件（面板内在线编辑用；缺省如下）----
# engine_config = /etc/sodama/config.dae
# rules_dir = /etc/sodama/rules
