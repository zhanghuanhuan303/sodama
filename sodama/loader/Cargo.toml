[package]
name = "sodama"
version = "1.0.0"
edition = "2021"
description = "Rust reimplementation of dae's core datapath (userspace loader) — study project"
license = "AGPL-3.0-only"
repository = "https://github.com/zhanghuanhuan303/sodama"

[dependencies]
aya = "0.14"
libc = "0.2"
serde_json = "1"
regex = "1"
# P5 G1：协议栈（ss/trojan）
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
# SS2022（SIP022）：BLAKE3 子密钥派生（context = "shadowsocks 2022 session subkey"）
blake3 = "1"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
base64 = "0.22"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
# P31：shadow-tls 严格模式的 WebPKI 链/主机名/CV 校验（复用 rustls 生态的 ring 算法集）
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
# P5 G2：VMess AEAD（ECB auth id / SHAKE128 长度掩码 / CRC32 校验和）
aes = "0.8"
sha3 = "0.10"
hmac = "0.12"
crc32fast = "1"
# P5 G3：TUIC v5（QUIC；quinn + tokio 运行时桥接到阻塞 relay）
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
# P5 G3b+：自定义拥塞控制器需要 quinn-proto 的 Controller/RttEstimator 类型
quinn-proto = { version = "0.11.19", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
bytes = "1"
# P5 G3b+：salamander 混淆（BLAKE2b-256）
blake2 = "0.10"
# P18c+ REALITY/Vision：TLS 1.3 自实现需要的原语
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.2"

[lints]
workspace = true
