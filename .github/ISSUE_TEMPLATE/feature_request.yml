name: Feature request
description: 提议新能力或改进（请说明验收标准与边界）
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现状、影响与已有 workaround
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 行为、配置/CLI、与 dae 的对照（如有）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何判定完成（单测 / lab 用例 / 真实节点 / 性能口径）
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 边界与不做项
      description: 明确不在本提案范围内的内容
